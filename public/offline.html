<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Tezgahçı</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #004aad;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #fff;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      p { opacity: 0.85; font-size: 15px; margin: 0; max-width: 320px; }
      button {
        margin-top: 8px;
        border: 1px solid rgba(255,255,255,0.5);
        background: transparent;
        color: #fff;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <p><strong>Bağlantı yok.</strong><br />İnternete bağlanamadık. Bağlantını kontrol edip tekrar dene.</p>
    <button onclick="location.reload()">Tekrar dene</button>
  </body>
</html>
